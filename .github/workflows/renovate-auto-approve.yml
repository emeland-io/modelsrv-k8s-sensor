name: renovate-auto-approve

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  approve:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    uses: opendefensecloud/dev-kit/.github/workflows/renovate-auto-approve.yml@<full-commit-sha> # v3.0.0
    permissions:
      pull-requests: write